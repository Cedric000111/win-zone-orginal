<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | WIN ZONE</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#030914;
            color:white;
        }

        .reset-card {
            width:min(450px,calc(100% - 30px));
            padding:28px;
            border-radius:22px;
            background:rgba(13,27,46,.96);
            border:1px solid rgba(255,255,255,.09);
        }

        .reset-card h1 {
            text-align:center;
        }

        .reset-card p {
            color:#91a2b7;
            line-height:1.6;
            font-size:13px;
        }

        label {
            display:block;
            margin:17px 0 7px;
            font-size:13px;
            font-weight:700;
        }

        input {
            width:100%;
            padding:14px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.12);
            background:rgba(255,255,255,.04);
            color:white;
            outline:none;
        }

        button {
            width:100%;
            margin-top:20px;
            padding:14px;
            border:0;
            border-radius:12px;
            background:linear-gradient(90deg,#00e5ff,#7c4dff);
            color:#03101c;
            font-weight:900;
            cursor:pointer;
        }

        .back {
            display:block;
            text-align:center;
            margin-top:15px;
            color:#00e5ff;
            text-decoration:none;
            font-size:13px;
        }
    </style>
</head>

<body>

<section class="reset-card">

    <div style="text-align:center;">
        <div class="wz-badge">ACCOUNT SECURITY</div>
    </div>

    <h1>Reset Password</h1>

    <p>
        The active WIN ZONE recovery process uses the OTP flow
        in <strong>forgot-password.html</strong>.
    </p>

    <p>
        Use the recovery page below to request an OTP and create
        a new password.
    </p>

    <a
        href="forgot-password.html"
        style="
            display:block;
            text-align:center;
            padding:14px;
            margin-top:20px;
            border-radius:12px;
            background:linear-gradient(90deg,#00e5ff,#7c4dff);
            color:#03101c;
            text-decoration:none;
            font-weight:900;
        "
    >
        Open Password Recovery
    </a>

    <a href="login.html" class="back">
        Back to Login
    </a>

</section>

<script src="js/global.js"></script>

</body>
</html>
